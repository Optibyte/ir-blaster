name: esp
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.1
  flutter_native_splash: ^2.0.0
  flutter_launcher_icons: ^0.13.1
  permission_handler: ^11.3.0
  flutter_bluetooth_serial: ^0.4.0 # ✅ Classic SPP for your ESP32
  animate_do: ^2.0.0
  shared_preferences: ^2.2.2
  location: ^5.0.3
  intl: ^0.19.0
  wifi_scan: ^0.4.1+2 # ✅ for scanning WiFi SSIDs
  mqtt_client: ^10.8.0
  url_launcher: ^6.2.0
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.2
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/icon/
    - assets/images/

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon1.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/icon1.png"
    background_color: "#FFFFFF"
    theme_color: "#9ACC50"
  windows:
    generate: true
    image_path: "assets/icon/icon1.png"
    icon_size: 48
